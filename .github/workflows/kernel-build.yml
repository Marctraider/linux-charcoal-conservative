name: Kernel package build

on:
  push:
    branches: [main]
    paths:
      - "kernel-build.trigger"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steamdeck-kernel-build
  cancel-in-progress: false

jobs:
  build-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Show runner disk and pull Arch build environment
        run: |
          df -h
          docker pull archlinux:base-devel
      - name: Build kernel, headers, and LAVD packages
        env:
          MAKEFLAGS: "-j2"
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            --env MAKEFLAGS="$MAKEFLAGS" \
            archlinux:base-devel \
            bash -euo pipefail -c '
              pacman -Sy --noconfirm archlinux-keyring
              pacman -Syu --noconfirm --needed \
                bc binutils cpio gettext glibc libelf libgcc openssl pahole perl \
                python rust rust-bindgen rust-src tar xxhash xz zlib zstd git \
                openssh llvm clang lld polly curl jq cargo upx
              useradd --create-home --uid 1001 builder
              printf "builder ALL=(ALL:ALL) NOPASSWD: ALL\n" > /etc/sudoers.d/builder
              chmod 0440 /etc/sudoers.d/builder
              chown -R builder:builder /work
              runuser -u builder -- env MAKEFLAGS="$MAKEFLAGS" bash scripts/build-packages.sh
              shopt -s nullglob
              kernel=(/work/linux-neptune-73-*.pkg.tar.*)
              headers=(/work/linux-neptune-73-headers-*.pkg.tar.*)
              lavd=(/work/packages/scx-scheds/scx-scheds-*.pkg.tar.*)
              [[ ${#kernel[@]} -eq 1 && ${#headers[@]} -eq 1 && ${#lavd[@]} -eq 1 ]]
              bsdtar -tf "${kernel[0]}" | grep -Eq "^usr/lib/modules/[^/]+/vmlinuz$"
              bsdtar -tf "${kernel[0]}" | grep -Fq "amd-pstate-epp-boost.service"
              bsdtar -tf "${headers[0]}" | grep -Eq "^usr/lib/modules/[^/]+/build/.config$"
              config_entry="$(bsdtar -tf "${headers[0]}" | grep -E "^usr/lib/modules/[^/]+/build/.config$" | head -n1)"
              for setting in \
                CONFIG_CPU_MITIGATIONS=n \
                CONFIG_SCHED_CLASS_EXT=y \
                CONFIG_MZEN2=y \
                CONFIG_LTO_CLANG_FULL=y \
                CONFIG_POLLY_CLANG=y \
                CONFIG_JOYSTICK_XPAD=m \
                CONFIG_JOYSTICK_XBOX_GIP=m; do
                bsdtar -xOf "${headers[0]}" "$config_entry" | grep -Fxq "$setting"
              done
              bsdtar -tf "${lavd[0]}" | grep -Fxq "usr/bin/scx_lavd"
              bsdtar -tf "${lavd[0]}" | grep -Fq "usr/lib/systemd/system/scx.service"
              echo "Kernel image, headers config, EPP service, and LAVD payload verified."
            '
      - name: Upload kernel, headers, and LAVD packages
        uses: actions/upload-artifact@v4
        with:
          name: steamdeck-kernel-packages
          path: |
            *.pkg.tar.*
            packages/scx-scheds/*.pkg.tar.*
          if-no-files-found: error
          retention-days: 14
