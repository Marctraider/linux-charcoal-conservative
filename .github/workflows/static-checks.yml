name: Static checks

on:
  push:
  pull_request:

jobs:
  shell-and-config-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          bash -n scripts/merge-config.sh
          bash -n scripts/fetch-valve-source.sh
          bash -n scripts/fetch-scx-scheds.sh
          bash -n scripts/checkout-valve-kernel.sh
          bash -n scripts/apply-kernel-patches.sh
          bash -n scripts/apply-amd-epp-rfc.sh
      - name: Check requested config policy
