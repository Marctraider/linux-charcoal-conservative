name: Static checks

on:
  push:
  pull_request:

jobs:
  shell-and-config-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          bash -n scripts/merge-config.sh
          bash -n scripts/fetch-valve-source.sh
          bash -n scripts/fetch-scx-scheds.sh
          bash -n scripts/checkout-valve-kernel.sh
          bash -n scripts/apply-kernel-patches.sh
          bash -n scripts/apply-amd-epp-rfc.sh
          bash -n scripts/build-kernel.sh
      - name: Check requested config policy
        run: |
          test -s config-valve-base
          test -s config-valve-neptune
          grep -Eq '^CONFIG_CPU_MITIGATIONS=n$' config-charcoal
          grep -Eq '^CONFIG_SCHED_CLASS_EXT=y$' config-charcoal
          grep -Eq '^CONFIG_JOYSTICK_XPAD=m$' config-charcoal
          grep -Eq '^CONFIG_JOYSTICK_XBOX_GIP=m$' config-neptune
          for f in config-valve-base config-valve-neptune config-neptune config-charcoal; do
            ! grep -Eiq 'CONFIG_(RYZEN_SMU|XONE|XPADNEO|XPAD_NOONE)' "$f"
            ! grep -Eq '^CONFIG_JOYSTICK_XPAD=n$' "$f"
            ! grep -Eq '^CONFIG_JOYSTICK_XBOX_GIP=n$' "$f"
          done
