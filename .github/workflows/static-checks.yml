name: Static checks

on:
  push:
  pull_request:

jobs:
  shell-and-config-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell and package recipe syntax
        run: |
          bash -n PKGBUILD
          bash -n scripts/merge-config.sh
          bash -n scripts/fetch-valve-source.sh
          bash -n scripts/fetch-scx-scheds.sh
          bash -n scripts/checkout-valve-kernel.sh
          bash -n scripts/apply-kernel-patches.sh
          bash -n scripts/apply-amd-epp-rfc.sh
          bash -n scripts/build-kernel.sh
          bash -n scripts/build-packages.sh
          bash -n install-charcoal.sh
          bash -n test-runtime.sh
          grep -Fq 'LTO_CLANG_FULL' test-runtime.sh
          grep -Fq 'POLLY_CLANG' test-runtime.sh
          grep -Fq 'cflags=-march=znver2' test-runtime.sh
          bash -n packages/scx-scheds/PKGBUILD
      - name: Check requested config and package policy
        run: |
          test -s config-valve-base
          test -s config-valve-neptune
          test -s patches/clang-polly.patch
          test -s patches/vangogh_allow_higher_cpu_freq.patch
          grep -Fxq 'pkgbase=linux-neptune-73' PKGBUILD
          grep -Fxq '_tag=7.3.1-valve3' PKGBUILD
          grep -Fxq 'pkgrel=3' PKGBUILD
          ! grep -Fq "'SKIP'" PKGBUILD
          grep -Fxq 'pkgver=1.1.3.linux.steamos.2' packages/scx-scheds/PKGBUILD
          grep -Fxq 'pkgrel=2' packages/scx-scheds/PKGBUILD
          grep -Fq 'SCX_SCHEDULER=scx_lavd' install-charcoal.sh
          grep -Fq 'SCX_FLAGS=--performance' install-charcoal.sh
          grep -Fq 'systemctl enable scx.service' install-charcoal.sh
          grep -Fq 'CONFIG_CPU_MITIGATIONS' test-runtime.sh
          grep -Fq 'epp_boost' test-runtime.sh
          grep -Fq '4200000' test-runtime.sh
          grep -Fq -- '--performance' test-runtime.sh
          grep -Fq '09f66735e5b52023a44001d019ca19204cb5760b' packages/scx-scheds/PKGBUILD
          ! grep -Eiq 'ryzen_smu|xone|xpadneo|xpad-noone' PKGBUILD
          grep -Fxq 'CONFIG_CPU_MITIGATIONS=n' config-charcoal
          grep -Fxq 'CONFIG_SCHED_CLASS_EXT=y' config-charcoal
          grep -Fxq 'CONFIG_LTO_CLANG_FULL=y' config-charcoal
          grep -Fxq 'CONFIG_POLLY_CLANG=y' config-charcoal
          grep -Fq 'KCFLAGS="-march=znver2"' PKGBUILD
          grep -Fq 'KCFLAGS="-march=znver2"' scripts/build-kernel.sh
          grep -Fxq 'CONFIG_JOYSTICK_XPAD=m' config-charcoal
          grep -Fxq 'CONFIG_JOYSTICK_XBOX_GIP=m' config-neptune
          grep -Fxq 'CONFIG_BPF_SYSCALL=y' config-valve-base
          grep -Fxq 'CONFIG_BPF_JIT=y' config-valve-base
          grep -Fxq 'CONFIG_DEBUG_INFO_BTF=y' config-valve-base
          for f in config-valve-base config-valve-neptune config-neptune config-charcoal; do
            ! grep -Eiq 'RYZEN_SMU|XONE|XPADNEO|XPAD_NOONE' "$f"
            ! grep -Fxq 'CONFIG_JOYSTICK_XPAD=n' "$f"
            ! grep -Fxq 'CONFIG_JOYSTICK_XBOX_GIP=n' "$f"
          done
